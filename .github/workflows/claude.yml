name: Claude Code

# A mention of @claude by someone with write access, or a manual dispatch, builds the ticket
# unattended and leaves a pull request for the owner. It never merges.
# .github/claude/unattended.md holds what Claude is told to do.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      prompt:
        description: What Claude should do, including the issue number it works on.
        required: true

permissions: {}

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read the pinned Flutter version
        id: flutter-version
        run: echo "version=$(python3 -c 'import json; print(json.load(open("alazkar/.fvmrc"))["flutter"])')" >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true

      # Book audit tickets (#116) compare the app with the pages of the book. The book is
      # copyrighted and this repository is public, so it is fetched from the author's site on
      # every run, checked against the edition the owner chose, drawn into page images, and never
      # committed or uploaded. A failure here leaves no pages, which stops audit tickets only.
      - name: Fetch the book and draw its pages
        continue-on-error: true
        env:
          BOOK_URL: https://almukaddem.com/download/4755
          BOOK_MD5: 986982e6b8e4817e3b4fbd05af5453b3
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils sqlite3 jq > /dev/null
          mkdir -p book-pages/pages
          curl -sSfL --retry 3 --max-time 600 -o book-pages/book.pdf "${BOOK_URL}"
          if ! echo "${BOOK_MD5}  book-pages/book.pdf" | md5sum --check --quiet; then
            rm -rf book-pages
            echo "::error::The book file on the author's site changed. It is not the edition the owner chose (#116), so no pages were drawn."
            exit 1
          fi
          pdftoppm -r 110 -png book-pages/book.pdf book-pages/pages/p
          rm book-pages/book.pdf
          echo "Drew $(ls book-pages/pages | wc -l) pages."

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # One token per Claude account. vars.CLAUDE_ACCOUNT (DP or MN3M) picks it; until the
          # owner sets that variable, a single CLAUDE_CODE_OAUTH_TOKEN is used.
          claude_code_oauth_token: ${{ secrets[format('CLAUDE_CODE_OAUTH_TOKEN_{0}', vars.CLAUDE_ACCOUNT)] || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ inputs.prompt }}
          # The repository is public, so anyone can comment on a ticket. Only the owner's
          # words, and Claude's own, reach Claude.
          include_comments_by_actor: "mn3m-cs,claude[bot]"
          additional_permissions: |
            actions: read
          claude_args: >-
            --append-system-prompt-file .github/claude/unattended.md
            --allowed-tools
            "Bash(flutter pub get:*)"
            "Bash(flutter analyze:*)"
            "Bash(flutter test:*)"
            "Bash(dart format:*)"
            "Bash(cd alazkar:*)"
            "Bash(gh pr create:*)"
            "Bash(gh pr view:*)"
            "Bash(gh issue view:*)"
            "Bash(gh issue edit:*)"
            "Bash(gh issue comment:*)"
            "Bash(gh api repos/mn3m-cs/mokhtassar-nasehaa/issues:*)"
            "Bash(sqlite3 alazkar/assets/db/Al-Azkar.db:*)"
            "Bash(python3 data_pipeline/:*)"
            "Bash(jq empty data_pipeline/sections/:*)"

      # Hermes schedules Claude by how much of the account's limit is left. Only the rate-limit
      # events leave the job: the execution file holds the whole conversation, tool output
      # included, and must not be published -- least of all on a public repository.
      - name: Extract the rate-limit reading
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          CLAUDE_ACCOUNT: ${{ vars.CLAUDE_ACCOUNT }}
        run: python3 .github/helper/claude_rate_limit.py "${EXECUTION_FILE}" > claude-rate-limit.json

      - name: Keep the rate-limit reading
        if: always() && hashFiles('claude-rate-limit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: claude-rate-limit
          path: claude-rate-limit.json
          retention-days: 14

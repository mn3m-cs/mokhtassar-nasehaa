name: Build and Release Alazkar

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    # Pinned: this workflow receives the signing key and the Play account.
    uses: muslimpack/.github/.github/workflows/flutter_release.yaml@3a1f26ae8bb1155e61ce6297e43b80bccea264d3
    with:
      app_directory: alazkar
      package_name: com.menemlabs.zaadalthakir
      java_version: '17'
    secrets:
      KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}